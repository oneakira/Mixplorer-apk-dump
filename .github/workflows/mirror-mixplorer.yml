name: Mirror MiXplorer Stable & Add-ons

on:
  schedule:
    - cron: '0 0 * * *'      # daily at midnight
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-mixplorer-stable
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install gdown
        run: pip install --no-cache-dir gdown

      - name: Sync, verify, and generate release metadata
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EXPECTED_CERT: "724eebd26a756e0762c255052e49709391baa21d17d98c34071e091f18b90063"
        run: |
          python3 - << 'EOF'
          import os, sys, re, glob, hashlib, subprocess, requests, gdown
          from concurrent.futures import ThreadPoolExecutor

          FOLDER_URL = "https://drive.google.com/drive/folders/1BfeK39boriHy-9q76eXLLqbCwfV17-Gv"
          HEADERS = {"Authorization": f"token {os.environ['GITHUB_TOKEN']}"}
          REPO = os.environ['REPO']
          EXPECTED_CERT = os.environ.get('EXPECTED_CERT', '').strip()

          # 1. Fast probe Google Drive file index without downloading
          print("Querying Google Drive index...")
          items = gdown.download_folder(FOLDER_URL, skip_download=True, quiet=True)

          # 2. Prune non-target architectures in memory
          target_items = [
              item for item in items
              if item.path.endswith('.apk') and not any(
                  arch in os.path.basename(item.path)
                  for arch in ['-x86.apk', '-x64.apk', '-arm.apk', '-API29']
              )
          ]
          print(f"Targeting {len(target_items)} modern/universal APKs.")

          # 3. Diff against latest release on GitHub
          res = requests.get(f"https://api.github.com/repos/{REPO}/releases/latest", headers=HEADERS)
          published_assets = {a["name"] for a in res.json().get("assets", [])} if res.status_code == 200 else set()
          drive_filenames = {os.path.basename(i.path) for i in target_items}
          new_or_updated = [fn for fn in drive_filenames if fn not in published_assets]

          if not new_or_updated and published_assets:
              print("No new updates found. Exiting early.")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("should_release=false\n")
              sys.exit(0)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("should_release=true\n")

          # 4. Determine version strings & tag
          core_version = "unknown"
          for item in target_items:
              m = re.search(r'MiXplorer-v([^/\\]+)', item.path)
              if m:
                  core_version = m.group(1)
                  break

          build_codes = [
              int(m.group(1)) for item in target_items
              if (m := re.search(r'_B(\d+)', os.path.basename(item.path)))
          ]
          max_build = max(build_codes) if build_codes else 0
          release_tag = f"v{core_version}+{max_build}"

          # 5. Parallel download
          os.makedirs("release_assets", exist_ok=True)
          def download_file(item):
              fn = os.path.basename(item.path)
              dest = os.path.join("release_assets", fn)
              gdown.download(f"https://drive.google.com/uc?id={item.id}", output=dest, quiet=True)
              return fn

          print(f"Downloading {len(target_items)} APKs concurrently...")
          with ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(download_file, target_items))

          # 6. Locate Android SDK tools
          build_tools = sorted(glob.glob(f"{os.environ['ANDROID_HOME']}/build-tools/*"))[-1]
          apksigner = os.path.join(build_tools, "apksigner")
          aapt = os.path.join(build_tools, "aapt")

          # 7. Verification & metadata extraction
          core_rows = []
          addon_rows = []

          for apk_path in sorted(glob.glob("release_assets/*.apk")):
              fn = os.path.basename(apk_path)

              # Check zip structure
              if subprocess.run(["unzip", "-t", apk_path], stdout=subprocess.DEVNULL).returncode != 0:
                  print(f"::error::Corrupt archive: {fn}")
                  sys.exit(1)

              # Verify signature
              cert_out = subprocess.check_output([apksigner, "verify", "--print-certs", apk_path], text=True)
              cert_match = re.search(r'SHA-256 digest:\s*([0-9a-fA-F]+)', cert_out)
              actual_cert = cert_match.group(1).lower() if cert_match else ""

              if EXPECTED_CERT == "REPLACE_WITH_ACTUAL_MIXPLORER_CERT_SHA256":
                  print(f"::warning::Certificate hash not configured. Set EXPECTED_CERT to: {actual_cert}")
              elif actual_cert != EXPECTED_CERT.lower():
                  print(f"::error::Certificate mismatch on {fn} (Got: {actual_cert})")
                  sys.exit(1)

              # Parse AAPT
              dump = subprocess.check_output([aapt, "dump", "badging", apk_path], text=True, errors="ignore")
              pkg = (re.search(r"package: name='([^']*)'", dump) or [None, ""])[1]
              vn = (re.search(r"versionName='([^']*)'", dump) or [None, ""])[1]
              vc = (re.search(r"versionCode='([^']*)'", dump) or [None, ""])[1]

              # Native SHA-256
              with open(apk_path, "rb") as f:
                  sha = hashlib.sha256(f.read()).hexdigest()

              row = f"| `{fn}` | `{pkg}` | {vn} ({vc}) | `{sha}` |\n"
              if fn.startswith("MiXplorer_"):
                  core_rows.append(row)
              else:
                  addon_rows.append(row)

          # 8. Render Markdown release notes
          with open("release_notes.md", "w") as md:
              md.write("Mirrored from official Google Drive distribution.\n\n")
              md.write("### What's Changed\n")
              if not published_assets:
                  md.write("- Initial mirror synchronization.\n\n")
              else:
                  md.write("**Updated in this release:**\n")
                  for f in new_or_updated:
                      md.write(f"- `{f}`\n")
                  md.write("\n")

              md.write("### Core Application\n\n| File | Package | Version | SHA-256 |\n| :--- | :--- | :--- | :--- |\n")
              md.writelines(core_rows)
              md.write("\n### Official Add-ons\n\n| File | Package | Version | SHA-256 |\n| :--- | :--- | :--- | :--- |\n")
              md.writelines(addon_rows)

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"RELEASE_TAG={release_tag}\n")
              f.write(f"CORE_VERSION={core_version}\n")
          EOF

      - name: Create release
        if: steps.sync.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: MiXplorer ${{ env.CORE_VERSION }} + Add-ons
          body_path: release_notes.md
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
