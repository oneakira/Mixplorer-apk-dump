name: Mirror MiXplorer Stable & Add-ons

on:
  schedule:
    - cron: '0 0 * * *'      # daily at midnight
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-mixplorer-stable
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: |
          pip install --upgrade gdown

      - name: Download Google Drive folder tree
        run: |
          mkdir -p gdrive_raw
          # Download public folder and subdirectories recursively
          gdown --folder "https://drive.google.com/drive/folders/1BfeK39boriHy-9q76eXLLqbCwfV17-Gv" -O gdrive_raw

      - name: Identify app version & check release status
        id: check_release
        run: |
          # Locate the MiXplorer-v* subfolder dynamically
          APP_DIR=$(find gdrive_raw -type d -name "MiXplorer-v*" | sort -V | tail -1)

          if [ -z "$APP_DIR" ]; then
            echo "::error::Could not find 'MiXplorer-v*' directory in downloaded files"
            exit 1
          fi

          FOLDER_NAME=$(basename "$APP_DIR")
          VERSION_NAME=$(echo "$FOLDER_NAME" | sed 's/^MiXplorer-v//')
          echo "Found version directory: $FOLDER_NAME (Version: $VERSION_NAME)"

          # Extract highest versionCode from APKs inside the versioned folder
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          AAPT="${BUILD_TOOLS}aapt"

          MAX_VC=0
          shopt -s globstar nullglob
          for apk in "$APP_DIR"/*.apk; do
            VC=$("$AAPT" dump badging "$apk" 2>/dev/null | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
            if [ -n "$VC" ] && [ "$VC" -gt "$MAX_VC" ]; then
              MAX_VC=$VC
            fi
          done

          if [ "$MAX_VC" -eq 0 ]; then
            echo "::error::Failed to read versionCode from APKs inside $APP_DIR"
            exit 1
          fi

          TAG="v${VERSION_NAME}+${MAX_VC}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV

          # Check if this tag already exists on GitHub
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")

          echo "Release status code: $CODE"
          if [ "$CODE" = "200" ]; then
            echo "RELEASE_EXISTS=true" >> $GITHUB_ENV
            echo "Release $TAG already exists. Skipping further processing."
          else
            echo "RELEASE_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Verify signatures and stage release assets
        if: env.RELEASE_EXISTS == 'false'
        env:
          # Developer cert SHA-256 fingerprint for verification
          EXPECTED: "REPLACE_WITH_ACTUAL_MIXPLORER_CERT_SHA256"
        run: |
          mkdir -p release_assets
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          APKSIGNER="${BUILD_TOOLS}apksigner"
          AAPT="${BUILD_TOOLS}aapt"

          cat << 'EOF' > release_notes.md
          Mirrored from official Google Drive distribution.

          ### Core Application
          | File | Package | Version | SHA-256 |
          |---|---|---|---|
          EOF

          shopt -s globstar nullglob

          # 1. Process Core MiXplorer APKs
          for apk in "${{ env.APP_DIR }}"/*.apk; do
            [ -f "$apk" ] || continue
            unzip -t "$apk" > /dev/null || { echo "Corrupt APK: $apk"; exit 1; }

            ACTUAL=$("$APKSIGNER" verify --print-certs "$apk" \
              | sed -n 's/.*SHA-256 digest: \([0-9a-f]*\).*/\1/p' | head -1)

            if [ "$EXPECTED" != "REPLACE_WITH_ACTUAL_MIXPLORER_CERT_SHA256" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Signature mismatch on $apk"
              exit 1
            fi

            FILE=$(basename "$apk")
            DUMP=$("$AAPT" dump badging "$apk" 2>/dev/null || true)
            PKG=$(echo "$DUMP" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")
            VN=$(echo "$DUMP" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            VC=$(echo "$DUMP" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
            SHA=$(sha256sum "$apk" | cut -d' ' -f1)

            echo "| \`$FILE\` | \`$PKG\` | $VN ($VC) | \`$SHA\` |" >> release_notes.md
            cp "$apk" release_assets/
          done

          cat << 'EOF' >> release_notes.md

          ### Official Add-ons
          | File | Source Folder | Package | Version | SHA-256 |
          |---|---|---|---|---|
          EOF

          # 2. Process Add-ons (skipping the main version directory)
          for apk in gdrive_raw/**/*.apk; do
            [ -f "$apk" ] || continue

            # Skip if file belongs to the main app folder
            case "$apk" in
              "${{ env.APP_DIR }}"*) continue ;;
            esac

            unzip -t "$apk" > /dev/null || { echo "Corrupt Add-on APK: $apk"; exit 1; }

            ACTUAL=$("$APKSIGNER" verify --print-certs "$apk" \
              | sed -n 's/.*SHA-256 digest: \([0-9a-f]*\).*/\1/p' | head -1)

            if [ "$EXPECTED" != "REPLACE_WITH_ACTUAL_MIXPLORER_CERT_SHA256" ] && [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Signature mismatch on $apk"
              exit 1
            fi

            FILE=$(basename "$apk")
            FOLDER=$(basename "$(dirname "$apk")")
            DUMP=$("$AAPT" dump badging "$apk" 2>/dev/null || true)
            PKG=$(echo "$DUMP" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")
            VN=$(echo "$DUMP" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            VC=$(echo "$DUMP" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
            SHA=$(sha256sum "$apk" | cut -d' ' -f1)

            echo "| \`$FILE\` | $FOLDER | \`$PKG\` | $VN ($VC) | \`$SHA\` |" >> release_notes.md
            cp "$apk" release_assets/
          done

      - name: Create release
        if: env.RELEASE_EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: MiXplorer ${{ env.VERSION_NAME }} + Add-ons
          body_path: release_notes.md
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
